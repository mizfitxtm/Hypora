# Kernel modules a desktop almost never needs and that have a history of exploitable bugs.
# To use one again, comment its line out; no reboot is needed.
# Rare network protocols
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
install n_hdlc /bin/false
install atm /bin/false
# Rare filesystems (hfsplus and udf stay available for Mac drives and discs)
install jffs2 /bin/false
install hfs /bin/false
# FireWire gives a plugged-in device direct access to memory
install firewire-core /bin/false
install firewire-ohci /bin/false
install firewire-sbp2 /bin/false
# A test driver, not hardware
install vivid /bin/false
