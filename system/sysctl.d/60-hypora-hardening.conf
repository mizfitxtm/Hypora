# Kernel settings Hypora tightens beyond Fedora's defaults. Undo: delete this file and reboot.
# Kernel addresses are hidden from every user, so a leak cannot guide an exploit.
kernel.kptr_restrict = 2
# Constants in BPF programs are blinded, which blocks JIT-spraying.
net.core.bpf_jit_harden = 2
# A process can trace only its own children, so one compromised app cannot read another's memory.
kernel.yama.ptrace_scope = 1
# The running kernel cannot be swapped for another one without a reboot.
kernel.kexec_load_disabled = 1
# Stricter handling of FIFOs and files in world-writable directories such as /tmp.
fs.protected_fifos = 2
fs.protected_regular = 2
# setuid programs never dump core, because a dump can hold secrets.
fs.suid_dumpable = 0
# Only root can load a tty line discipline, an old source of kernel bugs.
dev.tty.ldisc_autoload = 0
# IPv6 prefers temporary addresses, so the address does not identify this machine over time.
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2
