# Run Hypora's checks on every push, so a failing test cannot sit unnoticed.
name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/test-security.py
      - run: python3 tools/test-plugin.py
      - run: python3 tools/test-installer.py
      - run: python3 tools/check-theme.py
      - run: node tools/qml-syntax-check.js
